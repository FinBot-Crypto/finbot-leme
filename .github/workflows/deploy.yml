name: Deploy finbot-leme

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Sync Leme
        run: |
          set -e
          TARGET=/root/finbot-leme
          mkdir -p "$TARGET"
          rsync -a --delete --exclude .git --exclude .env --exclude .venv --exclude node_modules --exclude data --exclude models "$GITHUB_WORKSPACE/" "$TARGET/"
      - name: Build and start Leme
        working-directory: /root/finbot-leme
        run: docker compose --env-file .env up -d --build
      - name: Health check
        run: docker ps --filter name=fb-leme --filter name=fb-ml --format '{{.Names}} {{.Status}}'

